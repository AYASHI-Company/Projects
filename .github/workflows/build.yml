name: Build Data Watch APK
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Create app source
        shell: bash
        run: |
          cat > 'AndroidManifest.xml' <<'DATAWATCH_SOURCE_EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.datawatch.alarm" android:versionCode="2" android:versionName="2.0">
              <uses-sdk android:minSdkVersion="26" android:targetSdkVersion="35" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <application android:label="Data Watch" android:theme="@android:style/Theme.Material.NoActionBar" android:allowBackup="false" android:icon="@drawable/icon" android:supportsRtl="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
                  </activity>
                  <service android:name=".MonitorService" android:exported="false" android:foregroundServiceType="specialUse">
                      <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="User-started continuous network speed monitoring with an audible threshold alarm" />
                  </service>
              </application>
          </manifest>
          DATAWATCH_SOURCE_EOF
          mkdir -p 'src/com/datawatch/alarm'
          cat > 'src/com/datawatch/alarm/MainActivity.java' <<'DATAWATCH_SOURCE_EOF'
          package com.datawatch.alarm;
          
          import android.app.*;
          import android.content.*;
          import android.content.pm.PackageManager;
          import android.content.res.ColorStateList;
          import android.database.Cursor;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.media.RingtoneManager;
          import android.net.Uri;
          import android.os.*;
          import android.provider.OpenableColumns;
          import android.provider.Settings;
          import android.text.*;
          import android.view.*;
          import android.widget.*;
          import java.io.*;
          import java.util.Locale;
          
          public class MainActivity extends Activity {
              private final Handler handler=new Handler(Looper.getMainLooper());
              private android.content.SharedPreferences prefs;
              private TextView liveSpeed,unitLabel,status,downloadLabel,uploadLabel,soundLabel,permissionLabel,errorLabel,metricSummary;
              private EditText limitInput;
              private Button monitorButton,muteButton;
              private Sparkline chart;
              private int bg,card,fg,secondary,accent,line,unit;
              private boolean dark,initializing=true,pendingStart,importing;
              private long lastChart;
              private final TextView[] unitButtons=new TextView[3];
              private int dp(int n){return Math.round(n*getResources().getDisplayMetrics().density);}
              private GradientDrawable shape(int color,int radius){GradientDrawable d=new GradientDrawable();d.setColor(color);d.setCornerRadius(dp(radius));return d;}
              private TextView label(String s,int size,int color){TextView t=new TextView(this);t.setText(s);t.setTextSize(size);t.setTextColor(color);t.setFontFeatureSettings("tnum");return t;}
              private void gap(LinearLayout p,int h){p.addView(new View(this),new LinearLayout.LayoutParams(1,dp(h)));}
              private LinearLayout column(){LinearLayout l=new LinearLayout(this);l.setOrientation(1);return l;}
              private LinearLayout row(){LinearLayout l=new LinearLayout(this);l.setGravity(Gravity.CENTER_VERTICAL);return l;}
              private LinearLayout card(LinearLayout root){LinearLayout c=column();c.setPadding(dp(22),dp(20),dp(22),dp(20));c.setBackground(shape(card,24));LinearLayout.LayoutParams lp=new LinearLayout.LayoutParams(-1,-2);lp.bottomMargin=dp(14);root.addView(c,lp);return c;}
              private void title(LinearLayout p,String s){TextView t=label(s,17,fg);t.setTypeface(null,Typeface.BOLD);p.addView(t);}
              private Button button(String text,int color){Button b=new Button(this);b.setText(text);b.setTextSize(16);b.setAllCaps(false);b.setTypeface(null,Typeface.BOLD);b.setTextColor(dark?0xFF10251F:Color.WHITE);b.setBackground(shape(color,18));b.setMinHeight(dp(54));return b;}
              private Spinner selector(String[] entries,int selection){
                  Spinner s=new Spinner(this);
                  ArrayAdapter<String> adapter=new ArrayAdapter<String>(this,android.R.layout.simple_spinner_item,entries){
                      @Override public View getView(int p,View v,android.view.ViewGroup parent){TextView t=(TextView)super.getView(p,v,parent);t.setTextColor(fg);t.setTextSize(14);t.setPadding(0,dp(8),dp(8),dp(8));return t;}
                  };
                  adapter.setDropDownViewResource(android.R.layout.simple_spinner_dropdown_item);s.setAdapter(adapter);s.setSelection(selection);return s;
              }
              @Override public void onCreate(Bundle saved){
                  prefs=Prefs.get(this);dark=prefs.getBoolean("dark",true);setTheme(dark?android.R.style.Theme_Material_NoActionBar:android.R.style.Theme_Material_Light_NoActionBar);super.onCreate(saved);
                  bg=dark?0xFF0B1117:0xFFF1F5F5;card=dark?0xFF151F29:Color.WHITE;fg=dark?0xFFF0F6FA:0xFF172B36;secondary=dark?0xFF9BABBA:0xFF5C717C;accent=dark?0xFF79E2BD:0xFF147C62;line=dark?0xFF293744:0xFFE0E9ED;unit=prefs.getInt("unit",1);
                  getWindow().setStatusBarColor(bg);getWindow().setNavigationBarColor(bg);getWindow().setSoftInputMode(WindowManager.LayoutParams.SOFT_INPUT_ADJUST_RESIZE);getWindow().getDecorView().setSystemUiVisibility(dark?0:View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR|View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR);
                  ScrollView scroll=new ScrollView(this);scroll.setFillViewport(true);scroll.setBackgroundColor(bg);scroll.setClipToPadding(false);
                  LinearLayout root=column();root.setPadding(dp(20),dp(24),dp(20),dp(24));scroll.addView(root);setContentView(scroll);
                  // Target-35 edge-to-edge insets: keep controls clear of bars and keyboard.
                  root.setOnApplyWindowInsetsListener((v,insets)->{v.setPadding(dp(20),dp(20)+insets.getSystemWindowInsetTop(),dp(20),dp(24)+insets.getSystemWindowInsetBottom());return insets;});root.requestApplyInsets();
                  LinearLayout header=row();LinearLayout names=column();names.addView(label("NETWORK MONITOR",10,accent));TextView name=label("Data Watch",27,fg);name.setTypeface(null,Typeface.BOLD);names.addView(name);header.addView(names,new LinearLayout.LayoutParams(0,-2,1));
                  TextView theme=label(dark?"Light":"Dark",13,secondary);theme.setPadding(dp(16),dp(12),dp(16),dp(12));theme.setBackground(shape(card,18));theme.setContentDescription(dark?"Switch to light theme":"Switch to dark theme");theme.setOnClickListener(v->{save(false);prefs.edit().putBoolean("dark",!dark).apply();recreate();});header.addView(theme);root.addView(header);gap(root,24);
                  LinearLayout hero=card(root);LinearLayout top=row();top.addView(label("LIVE SPEED",11,secondary),new LinearLayout.LayoutParams(0,-2,1));status=label("PAUSED",11,accent);top.addView(status);hero.addView(top);gap(hero,14);
                  LinearLayout speedRow=row();speedRow.setGravity(Gravity.BOTTOM);liveSpeed=label("0.00",58,fg);liveSpeed.setTypeface(Typeface.create("sans-serif-light",Typeface.NORMAL));liveSpeed.setSingleLine(true);liveSpeed.setAutoSizeTextTypeUniformWithConfiguration(28,58,2,android.util.TypedValue.COMPLEX_UNIT_SP);liveSpeed.setContentDescription("Live network speed");speedRow.addView(liveSpeed,new LinearLayout.LayoutParams(0,dp(82),1));unitLabel=label(Prefs.UNITS[unit],18,secondary);unitLabel.setPadding(dp(8),0,0,dp(9));speedRow.addView(unitLabel);hero.addView(speedRow);
                  LinearLayout units=row();for(int i=0;i<3;i++){final int n=i;TextView chip=label(Prefs.UNITS[i],12,secondary);chip.setGravity(Gravity.CENTER);chip.setPadding(dp(12),dp(9),dp(12),dp(9));chip.setOnClickListener(v->changeUnit(n));chip.setContentDescription("Display speed in "+Prefs.UNITS[i]);LinearLayout.LayoutParams up=new LinearLayout.LayoutParams(0,dp(38),1);up.setMargins(i==0?0:dp(6),0,0,0);units.addView(chip,up);unitButtons[i]=chip;}hero.addView(units);gap(hero,10);paintUnits();
                  chart=new Sparkline(this,accent,line);hero.addView(chart,new LinearLayout.LayoutParams(-1,dp(94)));gap(hero,8);
                  LinearLayout traffic=row();downloadLabel=label("↓ 0.00 "+Prefs.UNITS[unit],12,secondary);uploadLabel=label("↑ 0.00 "+Prefs.UNITS[unit],12,secondary);traffic.addView(downloadLabel,new LinearLayout.LayoutParams(0,-2,1));traffic.addView(uploadLabel);hero.addView(traffic);
                  LinearLayout limits=card(root);title(limits,"Speed limit");gap(limits,8);LinearLayout entry=row();limitInput=new EditText(this);limitInput.setTextColor(fg);limitInput.setTextSize(28);limitInput.setSingleLine(true);limitInput.setInputType(InputType.TYPE_CLASS_NUMBER|InputType.TYPE_NUMBER_FLAG_DECIMAL);limitInput.setBackgroundTintList(ColorStateList.valueOf(accent));limitInput.setText(prefs.getString("limit","1"));limitInput.setContentDescription("Speed limit value");entry.addView(limitInput,new LinearLayout.LayoutParams(0,dp(62),1));TextView limitUnit=label(Prefs.UNITS[unit],16,secondary);limitUnit.setTag("limit-unit");entry.addView(limitUnit);limits.addView(entry);limits.addView(label("Alarm only above this rate · stops within 20 seconds",12,secondary));
                  limitInput.addTextChangedListener(new TextWatcher(){public void beforeTextChanged(CharSequence s,int a,int c,int f){}public void onTextChanged(CharSequence s,int a,int b,int c){if(!initializing){handler.removeCallbacks(applySettings);handler.postDelayed(applySettings,700);}}public void afterTextChanged(Editable e){}});
                  gap(limits,16);LinearLayout network=row();network.addView(label("Monitor",14,secondary),new LinearLayout.LayoutParams(0,-2,1));Spinner networks=selector(new String[]{"Mobile data","All networks"},prefs.getBoolean("all",false)?1:0);network.addView(networks);limits.addView(network);
                  networks.setOnItemSelectedListener(new AdapterView.OnItemSelectedListener(){public void onNothingSelected(AdapterView<?> a){}public void onItemSelected(AdapterView<?> a,View v,int p,long id){if(prefs.getBoolean("all",false)!=(p==1)){prefs.edit().putBoolean("all",p==1).apply();save(true);}}});
                  LinearLayout direction=row();direction.addView(label("Count",14,secondary),new LinearLayout.LayoutParams(0,-2,1));Spinner metricPicker=selector(new String[]{"Download + upload","Download only","Upload only"},prefs.getInt("metric",0));direction.addView(metricPicker);limits.addView(direction);
                  metricPicker.setOnItemSelectedListener(new AdapterView.OnItemSelectedListener(){public void onNothingSelected(AdapterView<?> a){}public void onItemSelected(AdapterView<?> a,View v,int p,long id){if(p!=prefs.getInt("metric",0)){prefs.edit().putInt("metric",p).apply();save(true);}}});
                  LinearLayout sampling=row();sampling.addView(label("Check every",14,secondary),new LinearLayout.LayoutParams(0,-2,1));int interval=prefs.getInt("interval",1000);int selected=interval==100?0:interval==250?1:interval==500?2:3;Spinner timing=selector(new String[]{"100 ms","250 ms","500 ms","1 second"},selected);sampling.addView(timing);limits.addView(sampling);
                  timing.setOnItemSelectedListener(new AdapterView.OnItemSelectedListener(){public void onNothingSelected(AdapterView<?> a){}public void onItemSelected(AdapterView<?> a,View v,int p,long id){int ms=new int[]{100,250,500,1000}[p];if(ms!=prefs.getInt("interval",1000)){prefs.edit().putInt("interval",ms).apply();save(true);}}});
                  limits.addView(label("Faster checks refresh a rolling 1-second average.",11,secondary));
                  LinearLayout alerts=card(root);title(alerts,"Alerts");gap(alerts,14);
                  LinearLayout soundRow=row();LinearLayout soundNames=column();soundNames.addView(label("Alarm sound",14,fg));soundLabel=label(prefs.getString("sound-name","Built-in pulse"),12,secondary);soundNames.addView(soundLabel);soundRow.addView(soundNames,new LinearLayout.LayoutParams(0,-2,1));soundRow.addView(label("Change  ›",13,accent));soundRow.setPadding(0,dp(4),0,dp(14));soundRow.setContentDescription("Choose alarm sound");soundRow.setOnClickListener(v->chooseSound());alerts.addView(soundRow);
                  View divider=new View(this);divider.setBackgroundColor(line);alerts.addView(divider,new LinearLayout.LayoutParams(-1,dp(1)));gap(alerts,12);
                  LinearLayout floating=row();LinearLayout floatingNames=column();floatingNames.addView(label("Show over other apps",14,fg));permissionLabel=label("Tap to allow floating alerts",12,secondary);floatingNames.addView(permissionLabel);floating.addView(floatingNames,new LinearLayout.LayoutParams(0,-2,1));TextView manage=label("Manage  ›",13,accent);floating.addView(manage);floating.setPadding(0,dp(6),0,dp(8));floating.setOnClickListener(v->overlaySettings());floating.setContentDescription("Manage floating alert permission");alerts.addView(floating);
                  errorLabel=label("",12,0xFFFFAA8A);root.addView(errorLabel);gap(root,4);
                  monitorButton=button("Start monitoring",accent);monitorButton.setContentDescription("Start or stop monitoring");root.addView(monitorButton,new LinearLayout.LayoutParams(-1,dp(56)));monitorButton.setOnClickListener(v->{if(MonitorService.running)stopService(new Intent(this,MonitorService.class));else startMonitoring();});
                  gap(root,10);muteButton=button("Mute this spike",dark?0xFFFFB495:0xFFBD4D30);root.addView(muteButton,new LinearLayout.LayoutParams(-1,dp(52)));muteButton.setOnClickListener(v->startService(new Intent(this,MonitorService.class).setAction("MUTE")));muteButton.setVisibility(View.GONE);gap(root,10);
                  metricSummary=label("",11,secondary);metricSummary.setGravity(Gravity.CENTER);root.addView(metricSummary);
                  initializing=false;
              }
              private void paintUnits(){for(int i=0;i<3;i++){unitButtons[i].setTextColor(i==unit?accent:secondary);unitButtons[i].setBackground(shape(i==unit?(dark?0xFF203B35:0xFFE4F3ED):card,11));}if(unitLabel!=null)unitLabel.setText(Prefs.UNITS[unit]);}
              private void changeUnit(int next){
                  if(next==unit)return;double bytes;
                  try{bytes=Double.parseDouble(limitInput.getText().toString().replace(',','.'))*Prefs.factor(unit);}catch(Exception e){bytes=Prefs.limit(this);}
                  unit=next;prefs.edit().putInt("unit",unit).apply();initializing=true;limitInput.setText(String.format(Locale.US,"%.12f",bytes/Prefs.factor(unit)).replaceAll("0+$","").replaceAll("\\.$",""));initializing=false;
                  TextView t=(TextView)getWindow().getDecorView().findViewWithTag("limit-unit");if(t!=null)t.setText(Prefs.UNITS[unit]);paintUnits();save(false);if(MonitorService.running)startService(new Intent(this,MonitorService.class).setAction("DISPLAY"));
              }
              private final Runnable applySettings=()->save(true);
              private boolean save(boolean update){
                  if(limitInput==null)return true;
                  String value=limitInput.getText().toString().trim().replace(',','.');
                  try{double n=Double.parseDouble(value)*Prefs.factor(unit);if(!Double.isFinite(n)||n<1||n>1_000_000_000_000d)throw new Exception();}
                  catch(Exception e){limitInput.setError("Use a positive limit of at least 1 byte/s");return false;}
                  boolean changed=!value.equals(prefs.getString("limit","1"));prefs.edit().putString("limit",value).putInt("unit",unit).apply();if(update&&MonitorService.running&&(changed||!initializing))startService(new Intent(this,MonitorService.class).setAction("UPDATE"));return true;
              }
              private void startMonitoring(){
                  if(importing){Toast.makeText(this,"Wait for the sound to finish importing",Toast.LENGTH_SHORT).show();return;}
                  if(!save(false))return;
                  if(Build.VERSION.SDK_INT>=33&&checkSelfPermission("android.permission.POST_NOTIFICATIONS")!=PackageManager.PERMISSION_GRANTED){pendingStart=true;requestPermissions(new String[]{"android.permission.POST_NOTIFICATIONS"},7);return;}
                  startForegroundService(new Intent(this,MonitorService.class).setAction("START"));
              }
              @Override public void onRequestPermissionsResult(int r,String[] permissions,int[] results){super.onRequestPermissionsResult(r,permissions,results);if(r==7&&pendingStart){pendingStart=false;if(results.length>0&&results[0]==PackageManager.PERMISSION_GRANTED)startMonitoring();else Toast.makeText(this,"Enable notifications in Android settings for visible alerts",Toast.LENGTH_LONG).show();}}
              private void overlaySettings(){
                  if(Settings.canDrawOverlays(this)){new AlertDialog.Builder(this).setTitle("Floating alerts").setMessage("Show a floating alert over other apps when the threshold is exceeded?").setPositiveButton("Enable",(d,w)->{prefs.edit().putBoolean("overlay",true).apply();refreshPermission();}).setNegativeButton("Disable",(d,w)->{prefs.edit().putBoolean("overlay",false).apply();refreshPermission();}).show();}
                  else{prefs.edit().putBoolean("overlay",true).apply();try{startActivity(new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION,Uri.parse("package:"+getPackageName())));}catch(Exception e){Toast.makeText(this,"Find Data Watch under Android Settings > Display over other apps",Toast.LENGTH_LONG).show();}}
              }
              private void refreshPermission(){if(permissionLabel!=null)permissionLabel.setText(Settings.canDrawOverlays(this)?(prefs.getBoolean("overlay",true)?"Enabled · floating alert on a spike":"Disabled · tap to enable"):"Permission needed · tap to allow");}
              private void chooseSound(){
                  if(importing)return;
                  new AlertDialog.Builder(this).setTitle("Alarm sound").setItems(new String[]{"Built-in pulse","Choose a phone sound","Import an audio file"},(d,which)->{
                      if(which==0){prefs.edit().putString("sound","").putString("sound-name","Built-in pulse").apply();soundLabel.setText("Built-in pulse");}
                      else if(which==1){Intent i=new Intent(RingtoneManager.ACTION_RINGTONE_PICKER);i.putExtra(RingtoneManager.EXTRA_RINGTONE_TYPE,RingtoneManager.TYPE_ALL);i.putExtra(RingtoneManager.EXTRA_RINGTONE_SHOW_SILENT,false);i.putExtra(RingtoneManager.EXTRA_RINGTONE_SHOW_DEFAULT,true);i.putExtra(RingtoneManager.EXTRA_RINGTONE_TITLE,"Choose alarm sound");try{startActivityForResult(i,20);}catch(Exception e){openAudio();}}
                      else openAudio();
                  }).show();
              }
              private void openAudio(){try{Intent i=new Intent(Intent.ACTION_OPEN_DOCUMENT).setType("audio/*").addCategory(Intent.CATEGORY_OPENABLE).addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);startActivityForResult(i,21);}catch(Exception e){Toast.makeText(this,"No audio file picker is available",Toast.LENGTH_LONG).show();}}
              @Override protected void onActivityResult(int request,int result,Intent data){
                  super.onActivityResult(request,result,data);if(result!=RESULT_OK||data==null)return;
                  Uri uri=request==20?data.getParcelableExtra(RingtoneManager.EXTRA_RINGTONE_PICKED_URI):data.getData();if(uri==null)return;
                  String name="Custom audio";try(Cursor c=getContentResolver().query(uri,new String[]{OpenableColumns.DISPLAY_NAME},null,null,null)){if(c!=null&&c.moveToFirst())name=c.getString(0);}catch(Exception ignored){}
                  if(request==20){try{name=RingtoneManager.getRingtone(this,uri).getTitle(this);}catch(Exception ignored){}prefs.edit().putString("sound",uri.toString()).putString("sound-name",name).apply();soundLabel.setText(name);return;}
                  final String title=name;importing=true;soundLabel.setText("Importing audio…");
                  new Thread(()->{
                      File temp=new File(getFilesDir(),"alarm-import");boolean success=false;
                      try(InputStream input=getContentResolver().openInputStream(uri);OutputStream output=new FileOutputStream(temp)){
                          if(input==null)throw new IOException();byte[] buffer=new byte[8192];long total=0;int count;while((count=input.read(buffer))!=-1){total+=count;if(total>20*1024*1024)throw new IOException("Audio must be under 20 MB");output.write(buffer,0,count);}if(total==0)throw new IOException();success=true;
                      }catch(Exception e){}
                      final boolean ok=success&&temp.renameTo(new File(getFilesDir(),"custom-alarm"));
                      handler.post(()->{importing=false;if(ok){prefs.edit().putString("sound","custom").putString("sound-name",title).apply();soundLabel.setText(title);}else{temp.delete();soundLabel.setText(prefs.getString("sound-name","Built-in pulse"));Toast.makeText(this,"Could not import this audio. Choose a local file under 20 MB.",Toast.LENGTH_LONG).show();}});
                  },"AudioImport").start();
              }
              private final Runnable refresh=new Runnable(){public void run(){
                  boolean running=MonitorService.running;liveSpeed.setText(String.format(Locale.US,"%.3f",MonitorService.rate/Prefs.factor(unit)));downloadLabel.setText("↓ "+Prefs.rate(MonitorService.download,unit));uploadLabel.setText("↑ "+Prefs.rate(MonitorService.upload,unit));
                  metricSummary.setText(new String[]{"Download + upload","Download only","Upload only"}[prefs.getInt("metric",0)]+" · decimal units\nAlarm stops at/below the limit, or after 20 seconds.");if(!importing)soundLabel.setText(prefs.getString("sound-name","Built-in pulse"));
                  status.setText(!running?"PAUSED":MonitorService.above?(MonitorService.muted?"SILENCED":"ABOVE LIMIT"):"● LIVE");status.setTextColor(MonitorService.above?(dark?0xFFFFB495:0xFFBD4D30):accent);monitorButton.setText(running?"Stop monitoring":"Start monitoring");muteButton.setVisibility(MonitorService.above&&!MonitorService.muted?View.VISIBLE:View.GONE);
                  errorLabel.setText(MonitorService.soundError.isEmpty()?(running?MonitorService.message:""):MonitorService.soundError);errorLabel.setTextColor(MonitorService.soundError.isEmpty()?secondary:(dark?0xFFFFB495:0xFFBD4D30));
                  if(SystemClock.elapsedRealtime()-lastChart>=1000){chart.push(MonitorService.rate,Prefs.limit(MainActivity.this));lastChart=SystemClock.elapsedRealtime();}handler.postDelayed(this,100);
              }};
              @Override protected void onResume(){super.onResume();refreshPermission();handler.post(refresh);}
              @Override protected void onPause(){handler.removeCallbacks(refresh);handler.removeCallbacks(applySettings);boolean changed=limitInput!=null&&!limitInput.getText().toString().trim().replace(',','.').equals(prefs.getString("limit","1"));save(changed);super.onPause();}
          }
          DATAWATCH_SOURCE_EOF
          mkdir -p 'src/com/datawatch/alarm'
          cat > 'src/com/datawatch/alarm/MonitorService.java' <<'DATAWATCH_SOURCE_EOF'
          package com.datawatch.alarm;
          import android.app.*;
          import android.content.*;
          import android.graphics.Color;
          import android.graphics.PixelFormat;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.media.*;
          import android.net.TrafficStats;
          import android.net.Uri;
          import android.os.*;
          import android.provider.Settings;
          import android.view.*;
          import android.widget.*;
          
          public class MonitorService extends Service {
              public static volatile boolean running,above,alarming,muted;
              public static volatile double rate,download,upload;
              public static volatile String message="Monitoring is paused",soundError="";
              private final Handler handler=new Handler(Looper.getMainLooper());
              private final SpeedWindow window=new SpeedWindow();private final ThresholdState gate=new ThresholdState();
              private PowerManager.WakeLock wakeLock;private MediaPlayer player;private NotificationManager notifications;private AudioManager audio;private AudioFocusRequest focusRequest;
              private WindowManager windows;private LinearLayout overlay;private TextView overlaySpeed;
              private boolean all,attemptedSound;private double threshold;private int interval,unit,metric;private long lastNotification,lastOverlay;
              private final AudioAttributes attributes=new AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_ALARM).setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION).build();
              private int dp(int x){return Math.round(x*getResources().getDisplayMetrics().density);}
              private void config(){android.content.SharedPreferences p=Prefs.get(this);all=p.getBoolean("all",false);metric=p.getInt("metric",0);threshold=Prefs.limit(this);unit=p.getInt("unit",1);interval=p.getInt("interval",1000);if(interval!=100&&interval!=250&&interval!=500&&interval!=1000)interval=1000;}
              private PendingIntent action(String a,int n){return PendingIntent.getService(this,n,new Intent(this,MonitorService.class).setAction(a),PendingIntent.FLAG_IMMUTABLE|PendingIntent.FLAG_UPDATE_CURRENT);}
              private Notification notification(boolean alert){
                  PendingIntent open=PendingIntent.getActivity(this,0,new Intent(this,MainActivity.class),PendingIntent.FLAG_IMMUTABLE|PendingIntent.FLAG_UPDATE_CURRENT);
                  Notification.Builder b=new Notification.Builder(this,alert?"speed-alert-v2":"speed-monitor-v2").setSmallIcon(R.drawable.icon).setColor(0xFF78E1C1).setContentIntent(open).setOnlyAlertOnce(true)
                      .setContentTitle(alert?"Data limit exceeded":"Data Watch · "+Prefs.rate(rate,unit)).setContentText(alert?Prefs.rate(rate,unit)+" · limit "+Prefs.rate(threshold,unit):message)
                      .setStyle(new Notification.BigTextStyle().bigText(alert?"Current speed: "+Prefs.rate(rate,unit)+"\nThreshold: "+Prefs.rate(threshold,unit)+"\n"+(muted?"Silenced until speed drops below the limit.":"Alarm stops when usage falls, or after 20 seconds."):message)).setOngoing(true).setCategory(alert?Notification.CATEGORY_ALARM:Notification.CATEGORY_SERVICE);
                  if(alert&&!muted)b.addAction(new Notification.Action.Builder(null,"Mute this spike",action("MUTE",2)).build());
                  return b.addAction(new Notification.Action.Builder(null,"Stop monitoring",action("STOP",1)).build()).build();
              }
              private void startSound(boolean fallback){
                  if(!gate.shouldSound()||!running)return;
                  try{
                      MediaPlayer next=new MediaPlayer();player=next;next.setAudioAttributes(attributes);String uri=Prefs.get(this).getString("sound","");
                      if(!fallback&&!uri.isEmpty()){if(uri.equals("custom"))next.setDataSource(new java.io.File(getFilesDir(),"custom-alarm").getAbsolutePath());else next.setDataSource(this,Uri.parse(uri));}
                      else{android.content.res.AssetFileDescriptor fd=getResources().openRawResourceFd(R.raw.alarm);try{next.setDataSource(fd.getFileDescriptor(),fd.getStartOffset(),fd.getLength());}finally{fd.close();}}
