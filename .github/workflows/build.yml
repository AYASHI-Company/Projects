          package com.datawatch.alarm;
          public final class ThresholdState {
              public boolean above,muted,timedOut; private long started;
              public boolean update(double speed,double limit,boolean ready,long now){
                  boolean next=ready&&Double.isFinite(speed)&&Double.isFinite(limit)&&limit>0&&speed>limit;
                  boolean crossed=next&&!above;
                  if(!next){muted=false;timedOut=false;started=0;}
                  if(crossed)started=now;
                  above=next;
                  if(above&&now-started>=20000){muted=true;timedOut=true;}
                  return crossed;
              }
              public void mute(){if(above)muted=true;}
              public boolean shouldSound(){return above&&!muted;}
          }
