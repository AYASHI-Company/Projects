          import com.datawatch.alarm.*;
          public class MonitoringTest {
              private static int checks;
              private static void check(boolean b,String s){checks++;if(!b)throw new AssertionError(s);}
              public static void main(String[] args){
                  ThresholdState gate=new ThresholdState();
                  check(!gate.update(2000000,1000000,false,0)&&!gate.shouldSound(),"No alarm before a full measured window");
                  check(!gate.update(1000000,1000000,true,1000)&&!gate.shouldSound(),"Equal threshold must stay silent");
                  check(!gate.update(999999.999,1000000,true,1100)&&!gate.shouldSound(),"Nearly at threshold must stay silent");
                  check(gate.update(1000001,1000000,true,2000)&&gate.shouldSound(),"Crossing starts alarm");
                  check(!gate.update(1100000,1000000,true,21999)&&gate.shouldSound(),"Alarm may last up to 20 seconds");
                  check(!gate.update(1100000,1000000,true,22000)&&!gate.shouldSound()&&gate.timedOut,"20 second timeout silences the spike");
                  gate.update(2000000,1000000,true,100000);check(!gate.shouldSound(),"Same spike stays silent after timeout");
                  gate.update(1000000,1000000,true,100100);check(!gate.muted&&!gate.above,"Falling to threshold rearms");
                  check(gate.update(1000001,1000000,true,100200)&&gate.shouldSound(),"New spike alarms again");
                  gate.mute();check(!gate.shouldSound(),"User mute stops current spike");
                  gate.update(999999,1000000,true,100300);check(!gate.shouldSound(),"Below threshold always stops sound");
                  gate.update(Double.NaN,1000000,true,100400);check(!gate.shouldSound(),"Invalid rate stays silent");
                  gate.update(999999,0,true,100500);check(!gate.shouldSound(),"Invalid threshold stays silent");
                  gate.update(100000000,1000000,false,100600);check(!gate.shouldSound(),"Reset or unavailable samples cannot alarm even at a high rate");
                  check(RateCalculator.selectedRate(900000,200000,1)==900000,"Download-only excludes upload traffic");
                  check(RateCalculator.selectedRate(900000,200000,2)==200000,"Upload-only excludes downloads");
                  check(RateCalculator.selectedRate(900000,200000,0)==1100000,"Combined traffic is explicit");
                  SpeedWindow window=new SpeedWindow();
                  check(window.add(0,0,0)&&!window.ready,"First sample is a baseline");
                  for(int i=1;i<=9;i++){window.add(i*100,80000L*i,20000L*i);check(!window.ready,"Wait for complete first second");}
                  window.add(1000,800000,200000);check(window.ready&&window.download==800000&&window.upload==200000,"100ms polls correctly report combined one-second rate");
                  window.add(1100,880000,220000);check(window.download+window.upload==1000000,"Rolling window does not inflate rate");
                  window.add(1500,1200000,300000);check(window.download+window.upload==1000000,"Delayed sampling uses elapsed time");
                  window.add(1600,0,0);check(!window.ready&&window.download==0,"Counter reset rearms without false spike");
                  check(!window.add(1700,-1,0)&&!window.ready,"Unsupported statistics stay silent");
                  window.add(0,0,0);window.add(1000,0,0);check(window.ready&&window.download==0,"Idle traffic remains zero");
                  window.add(1000,4000000,0);check(!window.ready,"Duplicate timestamp cannot trigger alarm");
                  System.out.println(checks+" monitoring, timeout and sampling checks passed.");
              }
          }
