name: Build Data Watch APK
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Create app source
        shell: bash
        run: |
          cat > 'AndroidManifest.xml' <<'DATAWATCH_SOURCE_EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.datawatch.alarm" android:versionCode="1" android:versionName="1.0">
              <uses-sdk android:minSdkVersion="26" android:targetSdkVersion="35" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <application android:label="Data Watch" android:theme="@android:style/Theme.Material.NoActionBar" android:allowBackup="false" android:icon="@drawable/icon" android:supportsRtl="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
                  </activity>
                  <service android:name=".MonitorService" android:exported="false" android:foregroundServiceType="specialUse">
                      <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="User-started continuous network speed monitoring with an audible threshold alarm" />
                  </service>
              </application>
          </manifest>
          DATAWATCH_SOURCE_EOF
          mkdir -p 'src/com/datawatch/alarm'
          cat > 'src/com/datawatch/alarm/MainActivity.java' <<'DATAWATCH_SOURCE_EOF'
          package com.datawatch.alarm;
          
          import android.app.*;
          import android.os.*;
          import android.content.*;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.provider.Settings;
          import android.text.InputType;
          import android.view.*;
          import android.widget.*;
          import java.util.Locale;
          
          public class MainActivity extends Activity {
              private final Handler handler = new Handler();
              private TextView speed, status;
              private EditText threshold;
              private Switch allNetworks;
              private Button start;
              private final int mint = Color.rgb(85,228,188);
              private final Runnable refresh = new Runnable() {
                  public void run() {
                      speed.setText(String.format(Locale.US, "%.2f", MonitorService.rate / 1_000_000.0));
                      status.setText(MonitorService.message);
                      status.setTextColor(MonitorService.alarming ? Color.rgb(255,155,128) : mint);
                      threshold.setEnabled(!MonitorService.running);
                      allNetworks.setEnabled(!MonitorService.running);
                      start.setEnabled(!MonitorService.running);
                      handler.postDelayed(this, 500);
                  }
              };
              private int dp(int n) { return Math.round(n * getResources().getDisplayMetrics().density); }
              private TextView text(String s, int size, int color) {
                  TextView t = new TextView(this); t.setText(s); t.setTextSize(size); t.setTextColor(color); return t;
              }
              private void gap(LinearLayout parent, int n) { View v = new View(this); parent.addView(v, new LinearLayout.LayoutParams(1, dp(n))); }
              private Button button(String label, int color, LinearLayout parent) {
                  Button b = new Button(this); b.setText(label); b.setAllCaps(false); b.setTextColor(Color.rgb(10,25,33));
                  GradientDrawable shape = new GradientDrawable(); shape.setColor(color); shape.setCornerRadius(dp(14)); b.setBackground(shape);
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(-1, dp(54)); p.bottomMargin = dp(12); parent.addView(b,p); return b;
              }
              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  getWindow().setStatusBarColor(Color.rgb(10,22,31)); getWindow().setNavigationBarColor(Color.rgb(10,22,31));
                  ScrollView scroll = new ScrollView(this); scroll.setFillViewport(true); scroll.setBackgroundColor(Color.rgb(10,22,31));
                  LinearLayout root = new LinearLayout(this); root.setOrientation(1); root.setPadding(dp(26),dp(32),dp(26),dp(28)); scroll.addView(root); setContentView(scroll);
                  root.addView(text("DATA WATCH",14,mint)); gap(root,12);
                  TextView title=text("Catch the spike.",32,Color.WHITE); title.setTypeface(null,Typeface.BOLD); root.addView(title); gap(root,8);
                  root.addView(text("A continuous alarm when your data moves too fast.",16,Color.LTGRAY)); gap(root,26);
                  speed=text("0.00",64,Color.WHITE); speed.setTypeface(null,Typeface.BOLD); root.addView(speed);
                  root.addView(text("MB / SECOND  ·  DOWNLOAD + UPLOAD",12,Color.LTGRAY)); gap(root,12);
                  status=text(MonitorService.message,16,mint); root.addView(status); gap(root,26);
                  root.addView(text("Alarm threshold · MB/s",16,Color.WHITE));
                  threshold=new EditText(this); threshold.setTextColor(Color.WHITE); threshold.setSingleLine(true); threshold.setInputType(InputType.TYPE_CLASS_NUMBER|InputType.TYPE_NUMBER_FLAG_DECIMAL);
                  threshold.setText(getPreferences(0).getString("threshold","1")); root.addView(threshold,new LinearLayout.LayoutParams(-1,dp(54)));
                  allNetworks=new Switch(this); allNetworks.setText("Include Wi-Fi and other networks"); allNetworks.setTextColor(Color.WHITE); allNetworks.setChecked(getPreferences(0).getBoolean("all",false)); root.addView(allNetworks,new LinearLayout.LayoutParams(-1,dp(64)));
                  root.addView(text("Off = mobile data only. 1 MB = 1,000,000 bytes. Speed is sampled about once per second.",13,Color.LTGRAY)); gap(root,22);
                  start=button("Start monitoring",mint,root); start.setOnClickListener(v -> launch(false));
                  button("Test continuous alarm",Color.rgb(203,216,229),root).setOnClickListener(v -> launch(true));
                  button("Stop alarm & monitoring",Color.rgb(255,168,146),root).setOnClickListener(v -> {
                      stopService(new Intent(this,MonitorService.class));
                  });
                  button("Battery settings",Color.rgb(203,216,229),root).setOnClickListener(v -> {
                      try { startActivity(new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS,android.net.Uri.parse("package:"+getPackageName()))); } catch(Exception e) { Toast.makeText(this,"Open phone settings > Apps > Data Watch > Battery",Toast.LENGTH_LONG).show(); }
                  });
                  root.addView(text("The alarm stays on until you stop it, even after speed falls. Use your phone’s alarm volume to adjust loudness. Allow notifications and unrestricted battery use for reliable background monitoring. Monitoring uses battery and must be started again after a restart.",13,Color.LTGRAY));
              }
              private void launch(boolean test) {
                  if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission("android.permission.POST_NOTIFICATIONS") != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{"android.permission.POST_NOTIFICATIONS"},7);
                      Toast.makeText(this,"Allow notifications, then tap the button again.",Toast.LENGTH_LONG).show(); return;
                  }
                  double value;
                  try { value=Double.parseDouble(threshold.getText().toString().trim().replace(',','.')); if(!Double.isFinite(value)||value<=0||value>10000) throw new Exception(); }
                  catch(Exception e) { threshold.setError("Enter a number above 0 and at most 10000"); return; }
                  getPreferences(0).edit().putString("threshold",threshold.getText().toString()).putBoolean("all",allNetworks.isChecked()).apply();
                  Intent intent=new Intent(this,MonitorService.class).setAction(test?"TEST":"START").putExtra("threshold",value).putExtra("all",allNetworks.isChecked());
                  try { startForegroundService(intent); } catch(Exception e) { Toast.makeText(this,"Could not start: "+e.getMessage(),Toast.LENGTH_LONG).show(); }
              }
              @Override protected void onResume() { super.onResume(); handler.post(refresh); }
              @Override protected void onPause() { handler.removeCallbacks(refresh); super.onPause(); }
          }
          DATAWATCH_SOURCE_EOF
          mkdir -p 'src/com/datawatch/alarm'
          cat > 'src/com/datawatch/alarm/MonitorService.java' <<'DATAWATCH_SOURCE_EOF'
          package com.datawatch.alarm;
          
          import android.app.*;
          import android.content.*;
          import android.media.*;
          import android.net.TrafficStats;
          import android.os.*;
          import java.util.Locale;
          
          public class MonitorService extends Service {
              public static volatile boolean running=false, alarming=false;
              public static volatile double rate=0;
              public static volatile String message="Ready when you are";
              private final Handler handler=new Handler();
              private PowerManager.WakeLock wakeLock;
              private MediaPlayer player;
              private boolean all;
              private double threshold;
              private long previous=-1, previousTime;
              private NotificationManager notifications;
              private long bytes() {
                  long rx=all?TrafficStats.getTotalRxBytes():TrafficStats.getMobileRxBytes();
                  long tx=all?TrafficStats.getTotalTxBytes():TrafficStats.getMobileTxBytes();
                  return rx<0||tx<0 ? -1 : rx+tx;
              }
              private Notification notification() {
                  PendingIntent open=PendingIntent.getActivity(this,0,new Intent(this,MainActivity.class),PendingIntent.FLAG_IMMUTABLE|PendingIntent.FLAG_UPDATE_CURRENT);
                  PendingIntent stop=PendingIntent.getService(this,1,new Intent(this,MonitorService.class).setAction("STOP"),PendingIntent.FLAG_IMMUTABLE|PendingIntent.FLAG_UPDATE_CURRENT);
                  return new Notification.Builder(this,"monitor").setSmallIcon(com.datawatch.alarm.R.drawable.icon).setContentTitle(alarming?"Data Watch · ALARM":"Data Watch · monitoring")
                      .setContentText(message).setContentIntent(open).setOngoing(true).setOnlyAlertOnce(true)
                      .addAction(new Notification.Action.Builder(null,"Stop alarm & monitoring",stop).build()).build();
              }
              private void alarm() {
                  if(alarming) return;
                  try {
                      player=new MediaPlayer();
                      player.setAudioAttributes(new AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_ALARM).setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION).build());
                      android.content.res.AssetFileDescriptor fd=getResources().openRawResourceFd(R.raw.alarm);
                      player.setDataSource(fd.getFileDescriptor(),fd.getStartOffset(),fd.getLength()); fd.close();
                      player.setLooping(true); player.prepare(); player.start(); alarming=true;
                  } catch(Exception e) { if(player!=null) {player.release();player=null;} message="Sound failed. Stop and try again."; }
              }
              private final Runnable sample=new Runnable() {
                  public void run() {
                      long now=SystemClock.elapsedRealtime(), current=bytes();
                      if(current<0) { rate=0; message="Network statistics unavailable on this phone"; }
                      else {
                          rate=RateCalculator.bytesPerSecond(previous,current,now-previousTime);
                          if(RateCalculator.exceeds(rate,threshold)) alarm();
                          if(alarming) message="ALARM · tap Stop to silence";
                          else if(player==null && !message.startsWith("Sound failed")) message=String.format(Locale.US,"%s · %.2f MB/s · limit %.2f",all?"All networks":"Mobile data",rate/1_000_000.0,threshold);
                      }
                      previous=current; previousTime=now;
                      notifications.notify(1,notification()); handler.postDelayed(this,1000);
                  }
              };
              @Override public void onCreate() {
                  super.onCreate(); notifications=getSystemService(NotificationManager.class);
                  NotificationChannel channel=new NotificationChannel("monitor","Data monitoring",NotificationManager.IMPORTANCE_LOW); channel.setSound(null,null); notifications.createNotificationChannel(channel);
              }
              @Override public int onStartCommand(Intent intent,int flags,int id) {
                  if(intent==null || "STOP".equals(intent.getAction())) { stopSelf(); return START_NOT_STICKY; }
                  startForeground(1,notification());
                  if(!running) {
                      all=intent.getBooleanExtra("all",false); threshold=intent.getDoubleExtra("threshold",1);
                      previous=bytes(); previousTime=SystemClock.elapsedRealtime(); running=true;
                      wakeLock=((PowerManager)getSystemService(POWER_SERVICE)).newWakeLock(PowerManager.PARTIAL_WAKE_LOCK,"DataWatch:Monitor"); wakeLock.acquire();
                      message="Monitoring started"; handler.postDelayed(sample,1000);
                  }
                  if("TEST".equals(intent.getAction())) { alarm(); if(alarming) message="TEST ALARM · tap Stop to silence"; notifications.notify(1,notification()); }
                  return START_NOT_STICKY;
              }
              @Override public void onDestroy() {
                  handler.removeCallbacksAndMessages(null);
                  if(player!=null) { player.release(); player=null; }
                  if(wakeLock!=null && wakeLock.isHeld()) wakeLock.release();
                  running=false; alarming=false; rate=0; message="Stopped · tap Start to monitor again";
                  stopForeground(STOP_FOREGROUND_REMOVE); super.onDestroy();
              }
              @Override public IBinder onBind(Intent i) { return null; }
          }
          DATAWATCH_SOURCE_EOF
          mkdir -p 'src/com/datawatch/alarm'
          cat > 'src/com/datawatch/alarm/RateCalculator.java' <<'DATAWATCH_SOURCE_EOF'
          package com.datawatch.alarm;
          
          public final class RateCalculator {
              private RateCalculator() {}
              public static double bytesPerSecond(long previous, long current, long elapsedMs) {
                  if (previous < 0 || current < previous || elapsedMs <= 0) return 0;
                  return (current - previous) * 1000.0 / elapsedMs;
              }
              public static boolean exceeds(double rate, double thresholdMb) {
                  return rate > thresholdMb * 1_000_000.0;
              }
          }
          DATAWATCH_SOURCE_EOF
          mkdir -p 'res/drawable'
          cat > 'res/drawable/icon.xml' <<'DATAWATCH_SOURCE_EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="48dp" android:height="48dp" android:viewportWidth="48" android:viewportHeight="48">
          <path android:fillColor="#11222E" android:pathData="M0,0h48v48h-48z" />
          <path android:fillColor="#55E4BC" android:pathData="M7,27h7l4,-15 8,25 5,-17 3,7h7v4h-10l-1,-3 -4,16 -8,-25 -1,12h-10z" />
          </vector>
          DATAWATCH_SOURCE_EOF
          mkdir -p 'tests'
          cat > 'tests/RateCalculatorTest.java' <<'DATAWATCH_SOURCE_EOF'
          import com.datawatch.alarm.RateCalculator;
          
          public class RateCalculatorTest {
              private static void check(boolean condition, String description) {
                  if (!condition) throw new AssertionError(description);
              }
              public static void main(String[] args) {
                  check(!RateCalculator.exceeds(1_000_000, 1), "Exactly 1 MB/s must not trigger");
                  check(RateCalculator.exceeds(1_000_001, 1), "Above 1 MB/s must trigger");
                  check(!RateCalculator.exceeds(999_999, 1), "Below the threshold must not trigger");
                  check(RateCalculator.bytesPerSecond(0, 2_000_000, 2000) == 1_000_000, "Use actual elapsed time");
                  check(RateCalculator.bytesPerSecond(4_000_000, 1, 1000) == 0, "Counter resets must not trigger");
                  check(RateCalculator.bytesPerSecond(-1, 9_000_000, 1000) == 0, "Unsupported counters must not trigger");
                  check(RateCalculator.bytesPerSecond(0, 9_000_000, 0) == 0, "Zero elapsed time must not trigger");
                  check(RateCalculator.exceeds(500_001, 0.5), "Custom thresholds must work");
                  System.out.println("All 8 network-rate checks passed.");
              }
          }
          DATAWATCH_SOURCE_EOF
          cat > 'build.sh' <<'DATAWATCH_SOURCE_EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$(dirname "$0")"
          export JAVA_HOME="${JAVA_HOME_17_X64:-${JAVA_HOME:?Java 17 is required}}"
          export PATH="$JAVA_HOME/bin:$PATH"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK" ]]; then echo 'Android SDK is required'; exit 1; fi
          BT="$SDK/build-tools/35.0.0"
          PLATFORM="$SDK/platforms/android-35/android.jar"
          if [[ ! -f "$PLATFORM" || ! -x "$BT/aapt2" ]]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
            if [[ -z "$SDKMANAGER" ]]; then SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"; fi
            "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
          fi
          mkdir -p build/classes build/generated build/dex build/tests res/raw dist
          python3 - <<'PY'
          import math, struct, wave
          with wave.open('res/raw/alarm.wav', 'wb') as out:
              out.setparams((1, 2, 22050, 0, 'NONE', 'not compressed'))
              samples = []
              for i in range(22050):
                  # Alternating frequencies with a brief fade to prevent harsh clicks.
                  t = i / 22050
                  phase = t % 0.25
                  envelope = min(1, phase / 0.008, (0.25 - phase) / 0.008)
                  hz = 880 if int(t * 4) % 2 == 0 else 660
                  samples.append(struct.pack('<h', int(18000 * envelope * math.sin(2 * math.pi * hz * t))))
              out.writeframes(b''.join(samples))
          PY
          javac -d build/tests src/com/datawatch/alarm/RateCalculator.java tests/RateCalculatorTest.java
          java -cp build/tests RateCalculatorTest
          "$BT/aapt2" compile --dir res -o build/resources.zip
          "$BT/aapt2" link -o build/base.apk --manifest AndroidManifest.xml -I "$PLATFORM" --java build/generated --min-sdk-version 26 --target-sdk-version 35 -0 wav build/resources.zip
          find src build/generated -name '*.java' | sort > build/sources.txt
          javac -encoding UTF-8 --release 8 -classpath "$PLATFORM" -d build/classes @build/sources.txt
          jar cf build/classes.jar -C build/classes .
          "$BT/d8" --lib "$PLATFORM" --min-api 26 --output build/dex build/classes.jar
          jar uf build/base.apk -C build/dex classes.dex
          "$BT/zipalign" -f -p 4 build/base.apk build/aligned.apk
          if [[ ! -f build/personal.keystore ]]; then
            keytool -genkeypair -keystore build/personal.keystore -storepass android -keypass android -alias datawatch -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Data Watch Personal Build'
          fi
          "$BT/apksigner" sign --ks build/personal.keystore --ks-key-alias datawatch --ks-pass pass:android --key-pass pass:android --out dist/DataWatch.apk build/aligned.apk
          "$BT/apksigner" verify --verbose dist/DataWatch.apk
          "$BT/aapt2" dump badging dist/DataWatch.apk
          sha256sum dist/DataWatch.apk > dist/DataWatch.apk.sha256
          ls -lh dist/DataWatch.apk
          DATAWATCH_SOURCE_EOF
      - name: Test, build and verify installable APK
        shell: bash
        run: bash build.sh
      - name: Download your APK from this run
        uses: actions/upload-artifact@v4
        with:
          name: DataWatch-APK
          path: dist/
          if-no-files-found: error
          retention-days: 30
