          import math, struct, wave
          with wave.open('res/raw/alarm.wav', 'wb') as out:
              out.setparams((1, 2, 22050, 0, 'NONE', 'not compressed'))
              samples = []
              for i in range(22050):
                  # Alternating frequencies with a brief fade to prevent harsh clicks.
                  t = i / 22050
                  phase = t % 0.25
                  envelope = min(1, phase / 0.008, (0.25 - phase) / 0.008)
                  hz = 880 if int(t * 4) % 2 == 0 else 660
                  samples.append(struct.pack('<h', int(18000 * envelope * math.sin(2 * math.pi * hz * t))))
              out.writeframes(b''.join(samples))
          PY
          javac -d build/tests src/com/datawatch/alarm/RateCalculator.java src/com/datawatch/alarm/SpeedWindow.java src/com/datawatch/alarm/ThresholdState.java tests/RateCalculatorTest.java tests/MonitoringTest.java
          java -cp build/tests RateCalculatorTest
          java -cp build/tests MonitoringTest
          "$BT/aapt2" compile --dir res -o build/resources.zip
          "$BT/aapt2" link -o build/base.apk --manifest AndroidManifest.xml -I "$PLATFORM" --java build/generated --min-sdk-version 26 --target-sdk-version 35 -0 wav build/resources.zip
          find src build/generated -name '*.java' | sort > build/sources.txt
          javac -encoding UTF-8 --release 8 -classpath "$PLATFORM" -d build/classes @build/sources.txt
          jar cf build/classes.jar -C build/classes .
          "$BT/d8" --lib "$PLATFORM" --min-api 26 --output build/dex build/classes.jar
          jar uf build/base.apk -C build/dex classes.dex
          "$BT/zipalign" -f -p 4 build/base.apk build/aligned.apk
          if [[ ! -f build/personal.keystore ]]; then
            keytool -genkeypair -keystore build/personal.keystore -storepass android -keypass android -alias datawatch -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Data Watch Personal Build'
          fi
          "$BT/apksigner" sign --ks build/personal.keystore --ks-key-alias datawatch --ks-pass pass:android --key-pass pass:android --out dist/DataWatch.apk build/aligned.apk
          "$BT/apksigner" verify --verbose dist/DataWatch.apk
          "$BT/aapt2" dump badging dist/DataWatch.apk
          sha256sum dist/DataWatch.apk > dist/DataWatch.apk.sha256
          ls -lh dist/DataWatch.apk
          DATAWATCH_SOURCE_EOF
          cat > 'test-ui.sh' <<'DATAWATCH_SOURCE_EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          export JAVA_HOME="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          export PATH="$JAVA_HOME/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          PLATFORM="$ANDROID_HOME/platforms/android-35/android.jar"
          mkdir -p build/ui-classes build/ui-dex ui-results
          "$BT/aapt2" link --manifest tests/ui/AndroidManifest.xml -I "$PLATFORM" -o build/ui-base.apk
          javac --release 8 -classpath "$PLATFORM:build/classes" -d build/ui-classes tests/ui/UiSmoke.java
          jar cf build/ui-tests.jar -C build/ui-classes .
          "$BT/d8" --lib "$PLATFORM" --classpath build/classes.jar --min-api 26 --output build/ui-dex build/ui-tests.jar
          jar uf build/ui-base.apk -C build/ui-dex classes.dex
          "$BT/zipalign" -f 4 build/ui-base.apk build/ui-aligned.apk
          "$BT/apksigner" sign --ks build/personal.keystore --ks-key-alias datawatch --ks-pass pass:android --out build/ui-tests.apk build/ui-aligned.apk
          sdkmanager 'emulator' 'system-images;android-35;google_apis;x86_64' > ui-results/sdk.txt
          echo no | avdmanager create avd --force --name datawatch --package 'system-images;android-35;google_apis;x86_64' --device pixel_5
          sudo chmod a+rw /dev/kvm
          emulator -avd datawatch -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel on > ui-results/emulator.txt 2>&1 &
          timeout 240 bash -c 'until adb shell getprop sys.boot_completed 2>/dev/null | grep -q 1; do sleep 3; done'
          adb shell input keyevent 82
          adb install -r dist/DataWatch.apk
          adb install -r build/ui-tests.apk
          adb shell pm grant com.datawatch.alarm android.permission.POST_NOTIFICATIONS
          adb shell am instrument -w com.datawatch.alarm.tests/.UiSmoke | tee ui-results/result.txt
          adb pull /sdcard/Android/data/com.datawatch.alarm/files/ ui-results/screenshots || true
          adb logcat -d -s AndroidRuntime > ui-results/crashes.txt
          grep -q UI_SMOKE_OK ui-results/result.txt
          DATAWATCH_SOURCE_EOF
      - name: Test, build and verify installable APK
        shell: bash
        run: bash build.sh
      - name: Verify UI and idle alarm behavior on Android
        shell: bash
        run: bash test-ui.sh
      - name: Save UI verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DataWatch-UI-checks
          path: ui-results/
          retention-days: 14
      - name: Download your APK from this run
        uses: actions/upload-artifact@v4
        with:
          name: DataWatch-APK
          path: dist/
          if-no-files-found: error
          retention-days: 30
