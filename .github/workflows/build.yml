          package com.datawatch.alarm;
          import java.util.ArrayDeque;
          public final class SpeedWindow {
              private static final class Point { final long t,r,x; Point(long a,long b,long c){t=a;r=b;x=c;} }
              private final ArrayDeque<Point> points=new ArrayDeque<>();
              public double download,upload; public boolean ready;
              public void reset(){points.clear();download=upload=0;ready=false;}
              public boolean add(long time,long rx,long tx){
                  if(rx<0||tx<0){reset();return false;}
                  Point last=points.peekLast();
                  if(last!=null&&(time<=last.t||rx<last.r||tx<last.x))reset();
                  points.addLast(new Point(time,rx,tx));
                  while(points.size()>2){Point first=points.removeFirst();if(points.peekFirst().t>time-1000){points.addFirst(first);break;}}
                  Point first=points.peekFirst();long elapsed=time-first.t;ready=elapsed>=1000;
                  download=RateCalculator.bytesPerSecond(first.r,rx,elapsed);upload=RateCalculator.bytesPerSecond(first.x,tx,elapsed);return true;
              }
          }
