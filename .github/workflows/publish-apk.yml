name: Publish installable Data Watch APK
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-apk.yml'
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Publish the already verified APK
        shell: bash
        run: |
          set -euo pipefail
          gh run download 40142440911 --repo "$GITHUB_REPOSITORY" --name DataWatch-APK --dir dist
          (cd dist && sha256sum --check <(sed 's@dist/@@' DataWatch.apk.sha256))
          cat > release-notes.md <<'NOTES'
          ## Install on Android

          **[Download Data Watch 2.0](https://github.com/AYASHI-Company/Projects/releases/download/datawatch-v2.0.0/DataWatch.apk)**

          1. If you installed version 1, uninstall it first: its original temporary signing key was not retained. This resets the old app settings.
          2. Download DataWatch.apk on your Android 8+ phone, open it, and tap Install. Allow installation from your browser or Files app if prompted.
          3. Open Data Watch and allow notifications. Tap Manage beside Show over other apps and grant Android's display-over-other-apps permission.
          4. Choose KB/s, MB/s or GB/s, set your limit, and select mobile/all networks and download/upload/combined traffic.
          5. Choose a phone sound or import your own audio if desired, set the phone's alarm volume, then tap Start monitoring.

          ## What's new

          - Redesigned dark interface with a light-theme toggle, live speed, traffic chart, and separate download/upload readouts.
          - Strict comparison against the unrounded threshold: close to or equal to the limit stays silent.
          - One-second checks by default; 100, 250 and 500 ms checks refresh a rolling one-second rate.
          - Select download, upload or combined traffic; thresholds and speed display support decimal KB, MB and GB per second.
          - Custom audio imports and the phone's built-in sound picker.
          - Floating alerts over other apps when Android grants permission, plus a high-priority notification.
          - Audio stops at/below the limit or after 20 seconds. Muting or timing out silences that spike until traffic falls and crosses again.
          - No automatic monitoring on launch or reboot, no alarm test button, and one main start/stop control.

          Allow unrestricted battery use in Android app settings for background monitoring. Phone sound settings and battery management may affect operation. Start monitoring again after restarting your phone.

          Built and signature-verified on GitHub. Automated logic tests cover near/equal/over-limit values, counter resets, traffic selection, and the 20-second timeout. Android emulator checks cover both themes, unit conversion, explicit start/stop, notifications and silence on idle traffic. Manufacturer battery rules, Do Not Disturb, audio routing, and apps that block overlays can still affect behavior. Real-phone verification is still recommended.
          NOTES
          if gh release view datawatch-v2.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload datawatch-v2.0.0 dist/DataWatch.apk --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit datawatch-v2.0.0 --repo "$GITHUB_REPOSITORY" --draft=false --latest --title 'Data Watch 2.0 - Live speed and strict threshold alerts' --notes-file release-notes.md
          else
            gh release create datawatch-v2.0.0 dist/DataWatch.apk --repo "$GITHUB_REPOSITORY" --target 04056ca00c6a9bc7da2a78495def12e7cbfd9812 --latest --title 'Data Watch 2.0 - Live speed and strict threshold alerts' --notes-file release-notes.md
          fi
